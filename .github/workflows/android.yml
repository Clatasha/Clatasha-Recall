name: Android debug build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          "$SDK_MANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Name test APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Clatasha-Recall-v0.1.1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: clatasha-recall-v0.1.1-debug
          path: Clatasha-Recall-v0.1.1-debug.apk
